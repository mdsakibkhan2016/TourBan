name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production .env from GitHub Secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_ENCRYPTION: ${{ secrets.MAIL_ENCRYPTION }}
          PAYMENT_GATEWAY: ${{ secrets.PAYMENT_GATEWAY }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          SSLCOMMERZ_SANDBOX: ${{ secrets.SSLCOMMERZ_SANDBOX }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_URL=${APP_URL}"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_USER=${DB_USER}"
            echo "DB_PASS=${DB_PASS}"
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}"
            echo "MAIL_HOST=${MAIL_HOST}"
            echo "MAIL_PORT=${MAIL_PORT:-587}"
            echo "MAIL_USERNAME=${MAIL_USERNAME}"
            echo "MAIL_PASSWORD=${MAIL_PASSWORD}"
            echo "MAIL_FROM=${MAIL_FROM}"
            echo "MAIL_FROM_NAME=${MAIL_FROM_NAME:-TourBan}"
            echo "MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}"
            echo "PAYMENT_GATEWAY=${PAYMENT_GATEWAY:-sandbox}"
            echo "SSLCOMMERZ_STORE_ID=${SSLCOMMERZ_STORE_ID}"
            echo "SSLCOMMERZ_STORE_PASSWORD=${SSLCOMMERZ_STORE_PASSWORD}"
            echo "SSLCOMMERZ_SANDBOX=${SSLCOMMERZ_SANDBOX:-1}"
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
            echo "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}"
            echo "PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}"
            echo "PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}"
          } > .env
          echo "Created temporary .env ($(wc -c < .env) bytes)"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          timeout: 180000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env.example
            **/.vscode/**
            **/.idea/**
            **/logs/**
            **/*.log
            **/temporary/**
            **/temp/**

      - name: Remove temporary .env from workspace
        if: always()
        run: |
          rm -f .env
          echo "Temporary .env removed"
